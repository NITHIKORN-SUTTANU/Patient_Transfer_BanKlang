name: patient-transfer-demo

x-api: &api
  image: patient-transfer-demo-api:local
  env_file: .env.demo
  environment:
    DATABASE_URL: postgresql://patient_transfer:${POSTGRES_PASSWORD:?Set demo password}@database:5432/patient_transfer_demo
    API_HOST: 0.0.0.0
    API_PORT: 3001
    ALLOW_LINE_DELIVERY: 'false'

services:
  database:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_transfer_demo
      POSTGRES_USER: patient_transfer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set demo password}
    volumes:
      - demo_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U patient_transfer -d patient_transfer_demo']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *api
    restart: 'no'
    command: [node, scripts/database/migrate.mjs, up]
    depends_on:
      database:
        condition: service_healthy
  api:
    <<: *api
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  gateway:
    image: patient-transfer-demo-web:local
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DEMO_SITE: ${DEMO_SITE:?Set demo hostname}
    ports:
      - '${DEMO_BIND:-0.0.0.0}:${DEMO_HTTP_PORT:-80}:80'
      - '${DEMO_BIND:-0.0.0.0}:${DEMO_HTTPS_PORT:-443}:443'
    volumes:
      - demo_caddy_data:/data
      - demo_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  demo_database:
  demo_caddy_data:
  demo_caddy_config:
