services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: patient_transfer
      POSTGRES_USER: patient_transfer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - patient_transfer_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient_transfer -d patient_transfer"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  patient_transfer_database:
